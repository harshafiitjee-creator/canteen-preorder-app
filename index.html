<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Canteen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Campus Canteen</h1>
      <p class="tag">Order ahead • Quick pickup</p>
    </div>
  </header>

  <main class="container">
    <div id="order-message" class="order-message" role="status" aria-live="polite" hidden>
      <span id="order-message-text" class="order-message-text"></span>
      <button id="view-orders-btn" class="view-orders-btn" type="button" hidden>View My Orders</button>
    </div>

    <div class="menu-toolbar" aria-label="Menu and orders tabs">
      <div class="category-tabs" role="tablist" aria-label="Menu categories">
        <button class="category-tab active" type="button" role="tab" aria-selected="true" data-category="Snacks">Snacks</button>
        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="Meals">Meals</button>
        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="Beverages">Beverages</button>
      </div>
      <button id="my-orders-tab" class="category-tab orders-tab" type="button" role="tab" aria-selected="false" data-category="My Orders">My Orders</button>
    </div>

    <section id="menu-list" aria-label="Available menu items"></section>
    <p id="no-items" class="empty" hidden>No items available right now.</p>

    <section id="orders-section" class="orders-section" hidden>
      <div class="section-header">
        <h2>My Orders</h2>
      </div>
      <div id="orders-list" class="orders-list"></div>
    </section>

    <section id="cart-section" class="cart-section" hidden>
      <div class="cart-header">
        <h2>Your Cart</h2>
        <span id="cart-count">0 items</span>
      </div>

      <div id="cart-items" class="cart-items"></div>

      <div class="cart-summary">
        <span>Total</span>
        <strong id="cart-total">₹0</strong>
      </div>

      <div class="pickup-section">
        <div class="pickup-header">Pickup time</div>
        <div id="pickup-slot-buttons" class="pickup-slot-buttons"></div>
        <button id="test-fill-slot-btn" class="test-fill-slot-btn" type="button" hidden>Fill 12:30 slot (test)</button>
      </div>

      <div class="checkout-row">
        <label class="field" for="customer-name">
          <span>Your name</span>
          <input id="customer-name" type="text" placeholder="Enter your name" autocomplete="name" />
        </label>
        <div class="checkout-action">
          <button id="place-order-btn" class="place-order-btn" type="button">Place Order</button>
          <div id="checkout-error" class="checkout-error" role="alert" aria-live="assertive" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <button id="cart-bar" class="cart-bar" type="button" hidden>
    <span id="cart-bar-text"></span>
  </button>

  <script src="data/menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
