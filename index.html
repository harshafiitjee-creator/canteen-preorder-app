<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Canteen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Campus Canteen</h1>
      <p class="tag">Order ahead • Quick pickup</p>
    </div>
  </header>

  <main class="container">
    <div class="category-tabs" role="tablist" aria-label="Menu categories">
      <button class="category-tab active" type="button" role="tab" aria-selected="true" data-category="Snacks">Snacks</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="Meals">Meals</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="Beverages">Beverages</button>
    </div>

    <section id="menu-list" aria-label="Available menu items"></section>

    <p id="no-items" class="empty" hidden>No items available right now.</p>
  </main>

  <script src="data/menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
